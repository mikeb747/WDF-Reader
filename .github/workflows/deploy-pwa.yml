name: Build & Deploy WDF Reader PWA to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-pwa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund --legacy-peer-deps
          fi

      - name: Run WDF binary parser unit tests
        run: npx tsx --test src/lib/wdf/parser.test.ts

      - name: Build production PWA bundle (dist/ + sw.js + manifest.webmanifest)
        env:
          # Automatically sets Vite base path to /<repo-name>/ for GitHub Pages project sites,
          # or / if deploying to a <username>.github.io root repository.
          GITHUB_PAGES_BASE: ${{ endsWith(github.repository, '.github.io') && '/' || format('/{0}/', github.event.repository.name) }}
          # Production PWA build excludes AI Studio demo .wdf files and hides Block Map & TypeScript Export tabs
          VITE_PWA_BUILD: 'true'
        run: |
          npm run build
          rm -rf dist/assets/aistudio

      - name: Add SPA 404 fallback for GitHub Pages
        run: cp dist/index.html dist/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload PWA build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Attach downloadable PWA dist zip to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: wdf-reader-pwa-dist
          path: ./dist
          retention-days: 30

  deploy-pages:
    needs: build-pwa
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy PWA to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
